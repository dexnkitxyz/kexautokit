name: Build and publish release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pdf2image pyzbar pillow pyautogui pygetwindow pyperclip pytesseract tkinterdnd2

      - name: Build executable
        shell: cmd
        run: build_exe.bat

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist_release/kexauto.exe
          generate_release_notes: true
